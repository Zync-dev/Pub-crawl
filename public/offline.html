<!doctype html>
<html lang="da">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1F3B2D">
<title>Ingen forbindelse · Pub Crawl</title>
<!-- Vises af service workeren, når appen åbnes uden net. Alt ligger her i filen, for intet andet kan hentes. -->
<style>
  :root {
    --green-800: #1F3B2D; --green-700: #2C5240; --green-900: #142A1F;
    --gold-500: #C9A24A; --oxblood-700: #6E1F24; --cream-100: #FBF5E6;
    --rule-double: 4px double var(--gold-500);
    --font-display: "DM Serif Display", Georgia, "Times New Roman", serif;
    --font-body: "Libre Franklin", "Helvetica Neue", Arial, sans-serif;
    --ease: cubic-bezier(.2, .7, .2, 1);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; }
  body {
    min-height: 100dvh; display: flex; flex-direction: column; background: var(--green-800);
    color: var(--green-900); font: 15px/1.45 var(--font-body);
    padding: max(48px, env(safe-area-inset-top)) 16px max(32px, env(safe-area-inset-bottom));
  }
  .logo { flex: 1; display: flex; align-items: center; justify-content: center; padding: 24px 0; animation: fade 220ms var(--ease) both; }
  .card {
    width: 100%; max-width: 384px; margin: 0 auto; padding: 20px; border-radius: 14px;
    background: var(--cream-100); border: var(--rule-double); animation: rise 220ms var(--ease) 80ms both;
  }
  .eyebrow { margin: 0; font: 700 11px/1 var(--font-body); letter-spacing: .35em; text-transform: uppercase; color: var(--oxblood-700); }
  h1 { margin: 8px 0 12px; font: italic 30px/1.05 var(--font-display); color: var(--green-800); }
  p.body { margin: 0 0 20px; }
  button {
    width: 100%; height: 54px; border: 0; border-radius: 8px; background: var(--green-800); color: var(--cream-100);
    font: 600 17px/1 var(--font-body); letter-spacing: .02em; cursor: pointer;
    transition: background 140ms var(--ease), transform 80ms;
  }
  button:hover { background: var(--green-700); }
  button:active { transform: translateY(1px); }
  button:focus-visible { outline: 0; box-shadow: 0 0 0 3px rgba(201, 162, 74, .35); }
  @keyframes fade { from { opacity: 0; } to { opacity: 1; } }
  @keyframes rise { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
  @media (prefers-reduced-motion: reduce) { .logo, .card { animation: none; } button { transition: none; } }
</style>
</head>
<body>
  <div class="logo">
    <svg width="96" height="96" viewBox="0 0 96 96" role="img" aria-label="Pub Crawl">
      <rect width="96" height="96" rx="22" fill="#1F3B2D"/>
      <rect x="6" y="6" width="84" height="84" rx="17" fill="none" stroke="#C9A24A" stroke-width="2"/>
      <rect x="11" y="11" width="74" height="74" rx="13" fill="none" stroke="#C9A24A" stroke-width="2"/>

    </svg>
  </div>
  <main class="card">
    <p class="eyebrow">Ingen forbindelse</p>
    <h1>Nettet er væk</h1>
    <p class="body">Dine drinks er gemt på telefonen. Prøv igen om lidt.</p>
    <button type="button" onclick="location.reload()">Prøv igen</button>
  </main>
</body>
</html>
